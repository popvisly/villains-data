<?xml version="1.0" encoding="UTF-8"?>
<!-- Captori Capture Mark (minimal/Swiss). Uses currentColor so it can inherit brand color. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded square container -->
  <rect x="6" y="6" width="52" height="52" rx="14" stroke="currentColor" stroke-width="4" />

  <!-- Capture corners forming a subtle 'C' (open on the right) -->
  <path
    d="M24 20h-4c-2.209 0-4 1.791-4 4v4
       M24 44h-4c-2.209 0-4-1.791-4-4v-4"
    stroke="currentColor"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Inner capture ticks (top-left + bottom-left) to emphasize 'frame' -->
  <path
    d="M26 22h-4
       M26 42h-4"
    stroke="currentColor"
    stroke-width="4"
    stroke-linecap="round"
  />
</svg>
